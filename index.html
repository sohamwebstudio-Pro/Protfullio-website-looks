<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soham Thumbnail Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color: transparent;
}

body{
font-family:Poppins;
background:#0b0f1a;
color:white;
}

/* HERO */
.hero{
padding:60px 20px 30px;
text-align:center;
}

.hero h1{
font-size:34px;
line-height:1.2;
}

.highlight-red{
color:#ff3b3b;
font-weight:700;
}

.hero p{
margin-top:10px;
opacity:0.7;
}

/* CTA */
.cta{
margin-top:18px;
padding:12px 28px;
border-radius:40px;
background:#ff3b3b;
color:white;
text-decoration:none;
display:inline-block;
font-weight:500;
}

/* SOCIAL */
.socials{
margin-top:12px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.social-btn{
display:flex;
align-items:center;
gap:6px;
background:#121826;
padding:8px 14px;
border-radius:25px;
text-decoration:none;
color:white;
font-size:13px;
transition:0.2s;
}

.social-btn:hover{
background:#1a2235;
}

/* SECTION */
.section{
padding:40px 20px;
max-width:1100px;
margin:auto;
}

.section-title{
text-align:center;
font-size:24px;
margin-bottom:8px;
}

.section-sub{
text-align:center;
opacity:0.6;
margin-bottom:25px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:16px;
}

/* CARD */
.card{
background:#121826;
border-radius:14px;
overflow:hidden;
transition:0.25s ease;
cursor:pointer;
}

.card img{
width:100%;
transition:0.3s;
}

.card:hover{
transform:translateY(-6px) scale(1.02);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.card:hover img{
transform:scale(1.05);
}

.card:active{
transform:scale(0.96);
}

.result{
padding:10px;
text-align:center;
color:#00c6ff;
}

/* WHY */
.why-box{
background:#121826;
padding:14px;
border-radius:12px;
text-align:center;
font-size:14px;
}

/* REVIEW */
.review{
background:#121826;
padding:12px;
border-radius:12px;
margin-bottom:8px;
display:flex;
gap:8px;
align-items:center;
}

.review p{
font-size:14px;
}

.stars{
color:#ffd700;
min-width:85px;
}

/* FOOTER */
footer{
text-align:center;
padding:15px;
opacity:0.6;
font-size:14px;
}

/* 🤖 ROBOT CSS */
.robot-wrap{
position:fixed;
bottom:20px;
right:20px;
z-index:9999;
}

.robot{
width:70px;
height:95px;
position:relative;
cursor:pointer;
animation:float 3s ease-in-out infinite;
}

.robot-head{
width:58px;
height:42px;
background:linear-gradient(145deg,#1f2937,#0f172a);
border-radius:10px;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
gap:6px;
}

.eye{
width:8px;
height:8px;
background:#00e5ff;
border-radius:50%;
box-shadow:0 0 8px #00e5ff;
animation:blink 4s infinite;
}

.robot-body{
width:45px;
height:36px;
background:#111827;
margin:5px auto;
border-radius:8px;
}

.arm{
width:8px;
height:26px;
background:#1e293b;
position:absolute;
top:48px;
border-radius:10px;
}

.arm.left{left:2px;}
.arm.right{right:2px; transform-origin:top;}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-5px);}
}

@keyframes blink{
0%,90%,100%{transform:scaleY(1);}
95%{transform:scaleY(0.1);}
}

.wave{
animation:wave 0.6s ease;
}

@keyframes wave{
0%{transform:rotate(0deg);}
50%{transform:rotate(-25deg);}
100%{transform:rotate(0deg);}
}

.robot-chat{
position:absolute;
bottom:105px;
right:0;
width:240px;
background:#0f172a;
border-radius:12px;
padding:12px;
display:none;
}

.option{
background:#1e293b;
padding:7px;
border-radius:7px;
margin-bottom:5px;
cursor:pointer;
}

.robot-msg{
position:absolute;
bottom:110px;
right:0;
background:#2563eb;
padding:7px 10px;
border-radius:8px;
font-size:12px;
display:none;
transition:0.3s;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
<h1>Get more <span class="highlight-red">clicks</span></h1>
<p>Thumbnails that make people STOP & CLICK 🚀</p>

<a href="https://wa.me/919083946648?text=Hey%20I%20want%20a%20FREE%20thumbnail" class="cta">
Get 1 FREE Thumbnail
</a>
</section>

<!-- PORTFOLIO -->
<section class="section">
<h2 class="section-title">High CTR Thumbnails 🔥</h2>
<div class="grid">
<div class="card"><img src="thumb1.png"><div class="result">Anime ⚡</div></div>
<div class="card"><img src="thumb2.png"><div class="result">Psychology 🧠</div></div>
<div class="card"><img src="thumb3.png"><div class="result">AI 🤖</div></div>
<div class="card"><img src="thumb4.png"><div class="result">CTR Boost 🔥</div></div>
<div class="card"><img src="thumb5.png"><div class="result">Fitness 💪</div></div>
<div class="card"><img src="thumb6.png"><div class="result">Story 🎤</div></div>
</div>
</section>

<footer>Made with ❤️ by Soham</footer>
</body>
</html>
